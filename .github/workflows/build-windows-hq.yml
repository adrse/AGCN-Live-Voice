name: Build Windows HQ Voice

on:
  workflow_dispatch:

concurrency:
  group: agcn-windows-hq-build
  cancel-in-progress: true

jobs:
  build-hq:
    runs-on: windows-latest
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          python -m pip install -r requirements-voice-hq.txt
          python -m pip install pyinstaller

      - name: Smoke product persistence on Windows
        shell: pwsh
        run: |
          python -c "import tempfile; from pathlib import Path; from core.product_store import ProductStore; p=Path(tempfile.mkdtemp())/'products.json'; s=ProductStore(p); item=s.add(name='Produto teste', current_price='49,90', manual_fields=['name','current_price']); assert item['name']=='Produto teste'; assert s.active()['live_conditions']['current_price']==49.90; print('product save ok', item['created_at'])"

      - name: Download Kokoro fallback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models\kokoro" | Out-Null
          curl.exe -L --fail --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx" -o "models\kokoro\kokoro-v1.0.onnx"
          curl.exe -L --fail --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" -o "models\kokoro\voices-v1.0.bin"

      - name: Clone qwentts.cpp
        shell: pwsh
        run: |
          git clone --recursive --depth 1 https://github.com/ServeurpersoCom/qwentts.cpp.git vendor\qwentts.cpp

      - name: Build universal CPU Qwen3-TTS engine
        shell: pwsh
        run: |
          cmake -S vendor\qwentts.cpp -B vendor\qwentts.cpp\build -A x64
          cmake --build vendor\qwentts.cpp\build --config Release -j 4

      - name: Download Qwen3-TTS 1.7B Q8 Voice Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "voice_hq\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "voice_hq\models" | Out-Null
          Copy-Item "vendor\qwentts.cpp\build\Release\tts-server.exe" "voice_hq\bin\" -Force
          Get-ChildItem "vendor\qwentts.cpp\build\Release" -Filter "*.dll" | Copy-Item -Destination "voice_hq\bin" -Force
          curl.exe -L --fail --retry 3 "https://huggingface.co/Serveurperso/Qwen3-TTS-GGUF/resolve/main/qwen-talker-1.7b-customvoice-Q8_0.gguf?download=true" -o "voice_hq\models\qwen-talker-1.7b-customvoice-Q8_0.gguf"
          curl.exe -L --fail --retry 3 "https://huggingface.co/Serveurperso/Qwen3-TTS-GGUF/resolve/main/qwen-tokenizer-12hz-Q8_0.gguf?download=true" -o "voice_hq\models\qwen-tokenizer-12hz-Q8_0.gguf"

      - name: Smoke HQ provider assets
        shell: pwsh
        run: |
          python -c "from core.local_qwen3_tts import Qwen3HQLocalTTSProvider; p=Qwen3HQLocalTTSProvider(pack_dir='voice_hq',profile_id='female_fast',speed=1.0,startup_timeout_seconds=180); print(p.assets_status()); assert p.assets_status()[0]"

      - name: Synthesize Vivian and Ryan in Portuguese
        shell: pwsh
        run: |
          python -c "from core.local_qwen3_tts import Qwen3HQLocalTTSProvider; p=Qwen3HQLocalTTSProvider(pack_dir='voice_hq',profile_id='female_fast',speed=1.0,startup_timeout_seconds=180,request_timeout_seconds=180); a=p.synthesize('Olha só essa oferta, eu vou te mostrar rapidamente os principais benefícios desse produto.'); print('Vivian bytes',len(a.data)); assert len(a.data)>24000; p.close()"
          python -c "from core.local_qwen3_tts import Qwen3HQLocalTTSProvider; p=Qwen3HQLocalTTSProvider(pack_dir='voice_hq',profile_id='male_fast',speed=1.0,startup_timeout_seconds=180,request_timeout_seconds=180); a=p.synthesize('Olha só essa oferta, eu vou te mostrar rapidamente os principais benefícios desse produto.'); print('Ryan bytes',len(a.data)); assert len(a.data)>24000; p.close()"

      - name: Build AGCN executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "AGCN Live Voice" --paths . --add-data "models\kokoro;models\kokoro" --collect-all TikTokLive --collect-all keyring --collect-all kokoro_onnx --collect-all espeakng_loader --collect-all phonemizer --collect-all onnxruntime --collect-all imageio_ffmpeg desktop\main.py

      - name: Add HQ Voice Pack to distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\AGCN Live Voice\_internal\voice_hq" | Out-Null
          Copy-Item "voice_hq\*" "dist\AGCN Live Voice\_internal\voice_hq\" -Recurse -Force
          if (!(Test-Path "dist\AGCN Live Voice\_internal\voice_hq\bin\tts-server.exe")) { throw "HQ engine missing" }
          if (!(Test-Path "dist\AGCN Live Voice\_internal\voice_hq\models\qwen-talker-1.7b-customvoice-Q8_0.gguf")) { throw "HQ talker missing" }

      - name: Smoke executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AGCN Live Voice\AGCN Live Voice.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Executavel encerrou cedo. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Package HQ distribution
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=3 "AGCN-Live-Voice-Windows-HQ.7z" ".\dist\AGCN Live Voice\*"

      - uses: actions/upload-artifact@v4
        with:
          name: AGCN-Live-Voice-Windows-HQ
          path: AGCN-Live-Voice-Windows-HQ.7z
          if-no-files-found: error
          retention-days: 14

name: Build Windows Product Identity Tester

on:
  workflow_dispatch:
  push:
    branches:
      - v0.5.2-product-research
    paths:
      - "core/product_enrichment.py"
      - "core/product_research_v054.py"
      - "core/visual_product_discovery.py"
      - "tools/product_identity_tester_gui.py"
      - "requirements.txt"
      - ".github/workflows/build-product-identity-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AGCN_Product_Identity_Tester --collect-all playwright --collect-all imagehash --hidden-import PIL._tkinter_finder tools/product_identity_tester_gui.py

      - name: Self test
        shell: pwsh
        run: |
          .\dist\AGCN_Product_Identity_Tester.exe --self-test

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item .\dist\AGCN_Product_Identity_Tester.exe .\package\
          $lines = @(
            'AGCN PRODUCT IDENTITY TESTER',
            '',
            '1. Este teste é para Windows.',
            '2. É necessário Google Chrome instalado e conexão com a internet.',
            '3. Abra AGCN_Product_Identity_Tester.exe.',
            '4. Cole um link de produto do TikTok.',
            '5. Clique em Analisar produto.',
            '6. Uma janela do Chrome poderá abrir para o Google Lens.',
            '7. Não faça login. Aguarde a pesquisa terminar.',
            '8. O programa exibirá identidade, candidatos e correspondências.',
            '',
            'O processamento do AGCN é local. Não utiliza servidor AGCN para o Google Lens.'
          )
          $lines | Set-Content -Encoding UTF8 .\package\LEIA-ME.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AGCN-Product-Identity-Tester-Windows
          path: package
          if-no-files-found: error
          retention-days: 14
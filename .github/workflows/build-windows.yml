name: Build Windows Desktop

on:
  push:
    branches:
      - astra-handoff-2026-09-29
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          python -m pip install pyinstaller

      - name: Smoke imports
        shell: pwsh
        run: |
          python -c "import core.runtime, core.presenter_v3, core.tts_providers, core.audio_output, desktop.main_window; print('imports ok')"

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "AGCN Live Voice" --paths . --collect-all TikTokLive --collect-all keyring --collect-all pyttsx3 --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 desktop\main.py

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\AGCN Live Voice\AGCN Live Voice.exe")) { throw "Executavel nao encontrado" }
          Get-ChildItem "dist\AGCN Live Voice" | Select-Object Name,Length

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\AGCN Live Voice\*" -DestinationPath "AGCN-Live-Voice-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGCN-Live-Voice-Windows
          path: AGCN-Live-Voice-Windows.zip
          if-no-files-found: error
          retention-days: 14

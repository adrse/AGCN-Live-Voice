name: Build Windows Desktop

on:
  push:
    branches:
      - main
      - astra-handoff-2026-09-29
    paths:
      - "core/**"
      - "desktop/**"
      - "scripts/**"
      - "requirements-desktop.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: agcn-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          python -m pip install pyinstaller

      - name: Download bundled Kokoro voices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models\kokoro" | Out-Null
          curl.exe -L --fail --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx" -o "models\kokoro\kokoro-v1.0.onnx"
          curl.exe -L --fail --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" -o "models\kokoro\voices-v1.0.bin"
          Get-Item "models\kokoro\kokoro-v1.0.onnx"
          Get-Item "models\kokoro\voices-v1.0.bin"

      - name: Smoke imports
        shell: pwsh
        run: |
          python -c "import core.runtime, core.presenter_v3, core.tts_providers, core.local_kokoro_tts, core.audio_output, desktop.main_window; print('imports ok')"

      - name: Smoke product persistence on Windows
        shell: pwsh
        run: |
          python -c "import tempfile; from pathlib import Path; from core.product_store import ProductStore; p=Path(tempfile.mkdtemp())/'products.json'; s=ProductStore(p); item=s.add(name='Produto teste', current_price='49,90', manual_fields=['name','current_price']); assert item['name']=='Produto teste'; assert s.active()['live_conditions']['current_price']==49.90; print('product save ok', item['created_at'])"

      - name: Smoke two offline PT-BR voices
        shell: pwsh
        run: |
          python scripts\smoke_kokoro.py

      - name: Smoke UI
        shell: pwsh
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from desktop.main_window import MainWindow; app=QApplication([]); w=MainWindow(); w.show(); app.processEvents(); w.close(); print('ui ok')"

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "AGCN Live Voice" --paths . --add-data "models\kokoro;models\kokoro" --collect-all TikTokLive --collect-all keyring --collect-all kokoro_onnx --collect-all espeakng_loader --collect-all phonemizer --collect-all onnxruntime --collect-all imageio_ffmpeg desktop\main.py

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\AGCN Live Voice\AGCN Live Voice.exe")) { throw "Executavel nao encontrado" }
          if (!(Test-Path "dist\AGCN Live Voice\_internal\models\kokoro\kokoro-v1.0.onnx")) { throw "Modelo Kokoro nao empacotado" }
          if (!(Test-Path "dist\AGCN Live Voice\_internal\models\kokoro\voices-v1.0.bin")) { throw "Vozes Kokoro nao empacotadas" }
          Get-ChildItem "dist\AGCN Live Voice" | Select-Object Name,Length

      - name: Smoke executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AGCN Live Voice\AGCN Live Voice.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Executavel encerrou logo apos abrir. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\AGCN Live Voice\*" -DestinationPath "AGCN-Live-Voice-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGCN-Live-Voice-Windows
          path: AGCN-Live-Voice-Windows.zip
          if-no-files-found: error
          retention-days: 14

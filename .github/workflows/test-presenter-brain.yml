name: Presenter Brain Core

on:
  push:
    branches:
      - astra-handoff-2026-09-29
  workflow_dispatch:

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Run Brain, voice and config unit tests
        run: >
          python -m pytest -q
          tests/test_integration_contracts.py
          tests/test_presenter_policy.py
          tests/test_comment_selection_policy.py
          tests/test_brain_orchestrator.py
          tests/test_brain_context_builder.py
          tests/test_brain_factory.py
          tests/test_model_transports.py
          tests/test_presenter_v3.py
          tests/test_tts_voice_service.py
          tests/test_desktop_config_store.py

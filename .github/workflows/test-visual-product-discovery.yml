name: Test Visual Product Discovery

on:
  push:
    branches:
      - v0.5.2-product-research
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall core backend
      - run: pytest -q tests/test_visual_product_discovery.py

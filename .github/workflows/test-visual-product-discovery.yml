name: Test Visual Product Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall core backend
      - name: Run focused tests
        id: focused
        continue-on-error: true
        run: |
          mkdir -p .ci
          PYTHONPATH=. pytest -q tests/test_visual_product_discovery.py tests/test_reliable_identity.py tests/test_presenter_knowledge.py tests/test_persuasion_engine.py tests/test_presenter_flow_v3.py > .ci/visual-product-test.txt 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presenter-brain-test-diagnostics
          path: .ci/visual-product-test.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when focused tests fail
        if: steps.focused.outcome == 'failure'
        run: exit 1
